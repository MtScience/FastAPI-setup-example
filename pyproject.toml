[project]
name = "fast-api-setup-example"
version = "0.1.0"
description = ""
authors = []
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "pydantic",
    "pydantic-settings",
    "uvicorn",
    "sqlalchemy",
    "asyncpg",
    "alembic",
    "python-dotenv",
    "loguru",
]

[dependency-groups]
dev = [
    "mypy",
    "flake8",
    "isort",
    "black",
]
testing = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "testcontainers[postgres]",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[tool.black]
target-version = ["py313"]
line-length = 79

[tool.isort]
profile = "black"
py_version = 313

[tool.mypy]
plugins = ["pydantic.mypy"]
